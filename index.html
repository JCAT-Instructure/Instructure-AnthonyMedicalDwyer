<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dwyer Strategic Build</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        // Direct access to React hooks
        const { useState } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('governance');

            // This helper ensures icons render without crashing the app
            const TabIcon = ({ name }) => {
                const IconComponent = lucide.icons[name];
                return IconComponent ? <IconComponent size={16} /> : null;
            };

            return (
                <div className="min-h-screen font-sans antialiased text-slate-800">
                    {/* Fixed Navigation */}
                    <nav className="fixed top-0 left-0 right-0 z-50 bg-white border-b border-slate-200 h-24 flex items-center justify-between px-10 shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-[#f3592a] flex items-center justify-center shadow-lg rounded-sm rotate-45">
                                <div className="-rotate-45 text-white font-bold text-xl">D</div>
                            </div>
                            <div className="flex flex-col">
                                <span className="text-xl font-black uppercase tracking-tighter text-slate-900">Dwyer Strategic</span>
                                <span className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Healthcare Certification Fortress</span>
                            </div>
                        </div>

                        <div className="flex gap-2 bg-slate-100 p-1 rounded-full border border-slate-200">
                            {[
                                { id: 'governance', label: 'Governance', icon: 'Shield' },
                                { id: 'frontdoor', label: 'Storefront', icon: 'Store' },
                                { id: 'automation', label: 'Automation', icon: 'Zap' },
                                { id: 'dashboard', label: 'Insights', icon: 'BarChart3' }
                            ].map((tab) => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center gap-2 px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest transition-all ${
                                        activeTab === tab.id 
                                        ? 'bg-white text-[#f3592a] shadow-sm border border-slate-200' 
                                        : 'text-slate-400 hover:text-slate-600'
                                    }`}
                                >
                                    <TabIcon name={tab.icon} />
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <main className="max-w-7xl mx-auto px-10 pt-44 pb-32">
                        {activeTab === 'governance' && (
                            <div className="text-center transition-all duration-700">
                                <h2 className="text-5xl font-black mb-4 tracking-tighter text-slate-900">The Mothership Architecture</h2>
                                <p className="text-xl text-slate-500 max-w-3xl mx-auto leading-relaxed mb-16">
                                    A structured three-tier ecosystem separating regulatory state compliance from global revenue streams.
                                </p>

                                <div className="inline-block relative">
                                    <div className="bg-slate-900 text-white rounded-2xl p-12 w-[500px] shadow-2xl border border-white/10">
                                        <span className="text-[10px] font-black text-orange-400 uppercase tracking-[0.4em] block mb-4">Level 1: Central Command</span>
                                        <h4 className="text-3xl font-black tracking-tight">Anthony Dwyer</h4>
                                        <div className="mt-8 flex justify-center gap-4">
                                            <span className="px-4 py-2 bg-white/10 rounded-lg text-[9px] font-black uppercase">Global Financing Hub</span>
                                            <span className="px-4 py-2 bg-white/10 rounded-lg text-[9px] font-black uppercase">Portfolio Board</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab !== 'governance' && (
                            <div className="py-32 bg-white rounded-[3rem] border-4 border-dashed border-slate-100 text-center">
                                <h3 className="text-2xl font-black text-slate-300 uppercase tracking-widest italic">Section: {activeTab}</h3>
                                <p className="text-slate-400 mt-4 font-medium">Ready for infrastructure deployment.</p>
                            </div>
                        )}
                    </main>

                    <footer className="py-20 border-t border-slate-200 bg-white text-center">
                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-[0.5em]">HIPAA Compliant • Dwyer Strategic • 2026 Strategy</p>
                    </footer>
                </div>
            );
        };

        // Render call
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
