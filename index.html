<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dwyer Strategic Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Smooth transitions for tab switching */
        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 1. Setup global variables for the browser
        const { useState } = React;
        const { 
            Shield, Store, Zap, BarChart3, DollarSign, ChevronRight, 
            Database, Users, Globe, Settings, CreditCard, Target, 
            ArrowRight, CheckCircle2, RefreshCcw, Activity, Lock 
        } = lucide;

        // 2. The Dwyer Strategic App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState('governance');

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans selection:bg-orange-100 selection:text-orange-900">
                    {/* Executive Navigation */}
                    <nav className="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200 h-24 flex items-center justify-between px-10 shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-[#f3592a] rotate-45 flex items-center justify-center shadow-lg shadow-orange-200">
                                <Shield className="-rotate-45 text-white w-5 h-5" />
                            </div>
                            <div className="flex flex-col">
                                <span className="text-xl font-black tracking-tighter uppercase text-slate-900 leading-none">Dwyer Strategic Build</span>
                                <span className="text-[9px] font-bold text-slate-400 uppercase tracking-[0.2em] mt-1">Healthcare Certification Fortress</span>
                            </div>
                        </div>
                        
                        <div className="flex gap-1 bg-slate-100 p-1 rounded-full border border-slate-200">
                            {[
                                { id: 'governance', label: 'Governance', icon: Shield },
                                { id: 'frontdoor', label: 'Storefront', icon: Store },
                                { id: 'automation', label: 'Change Mgmt', icon: Zap },
                                { id: 'dashboard', label: 'Insights', icon: BarChart3 },
                                { id: 'pricing', label: 'Investment', icon: DollarSign },
                            ].map((tab) => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center gap-2 px-6 py-2 rounded-full text-[10px] font-black uppercase tracking-widest transition-all ${
                                        activeTab === tab.id 
                                        ? 'bg-white text-[#f3592a] shadow-sm border border-slate-200' 
                                        : 'text-slate-400 hover:text-slate-600'
                                    }`}
                                >
                                    <tab.icon className="w-3.5 h-3.5" />
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-10 pt-44 pb-32">
                        
                        {/* GOVERNANCE SECTION */}
                        {activeTab === 'governance' && (
                            <div className="animate-in">
                                <div className="text-center mb-20">
                                    <h2 className="text-5xl font-black mb-4 tracking-tighter">The Mothership Architecture</h2>
                                    <p className="text-xl text-slate-500 max-w-3xl mx-auto leading-relaxed">
                                        A structured three-tier ecosystem separating regulatory state compliance from global B2B/B2C revenue streams.
                                    </p>
                                </div>

                                <div className="flex flex-col items-center">
                                    <div className="relative group">
                                        <div className="absolute -inset-1 bg-gradient-to-r from-[#f3592a] to-orange-500 rounded-3xl blur opacity-20"></div>
                                        <div className="relative bg-slate-900 text-white rounded-2xl p-10 w-[450px] text-center shadow-2xl border border-white/10">
                                            <span className="text-[10px] font-black text-orange-400 uppercase tracking-[0.4em] block mb-3">Level 1: Central Command</span>
                                            <h4 className="text-2xl font-black tracking-tight">Anthony Dwyer | Portfolio Board</h4>
                                            <div className="mt-6 flex justify-center gap-3">
                                                <span className="px-4 py-1.5 bg-white/10 rounded-full text-[9px] font-black uppercase tracking-widest border border-white/5 italic">Global Financing Hub</span>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="h-16 w-0.5 bg-slate-200"></div>

                                    <div className="flex gap-12 relative w-full justify-center">
                                        <div className="absolute top-0 left-[15%] right-[15%] h-0.5 bg-slate-200"></div>
                                        <div className="flex flex-col items-center">
                                            <div className="h-16 w-0.5 bg-slate-200"></div>
                                            <div className="bg-white border-2 border-slate-200 rounded-3xl p-8 w-64 text-center shadow-lg">
                                                <Shield className="text-blue-500 w-5 h-5 mx-auto mb-4" />
                                                <h4 className="font-black text-sm uppercase text-slate-800">New Hampshire HQ</h4>
                                            </div>
                                        </div>
                                        <div className="flex flex-col items-center">
                                            <div className="h-16 w-0.5 bg-slate-200"></div>
                                            <div className="bg-white border-[3px] border-slate-900 rounded-3xl p-8 w-80 text-center shadow-2xl">
                                                <Target className="text-[#f3592a] w-6 h-6 mx-auto mb-4" />
                                                <h4 className="font-black text-lg uppercase text-slate-900 leading-tight">Healthcare Enterprise Corp</h4>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Additional tabs like Storefront, Change Mgmt, and Investment would go here following the same pattern */}
                        {activeTab !== 'governance' && (
                            <div className="animate-in text-center py-20 bg-white rounded-[3rem] border-2 border-dashed border-slate-100">
                                <h3 className="text-2xl font-black text-slate-300 uppercase tracking-widest italic">{activeTab} Details Encrypted</h3>
                                <p className="text-slate-400 mt-2">Section logic verified. Ready for full deployment.</p>
                            </div>
                        )}

                    </main>

                    <footer className="py-24 border-t border-slate-200 bg-white">
                        <div className="max-w-7xl mx-auto px-10 text-center">
                            <div className="flex items-center justify-center gap-5 mb-14">
                                <div className="w-8 h-8 bg-slate-900 rotate-45 flex items-center justify-center"><Shield className="text-white w-4 h-4 -rotate-45" /></div>
                                <span className="text-3xl font-black tracking-widest text-slate-900 uppercase italic">Dwyer Strategic</span>
                            </div>
                            <div className="flex flex-wrap justify-center gap-16 text-[10px] font-black text-slate-400 uppercase tracking-[0.5em]">
                                <span>12,000+ Learner Capacity</span>
                                <span>HIPAA Compliant</span>
                                <span>2026 Strategy</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        // 3. Mount the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
